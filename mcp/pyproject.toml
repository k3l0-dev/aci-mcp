[project]
name = "aci-mcp"
version = "1.2.0"
description = "Schema-driven FastMCP server for Cisco ACI APIC"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.12"
authors = [
    {name = "Khalid El-Ouiali", email = "monark.aiops@pm.me"},
]
maintainers = [
    {name = "Khalid El-Ouiali", email = "monark.aiops@pm.me"},
]
keywords = ["mcp", "cisco", "aci", "apic", "network-automation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.1.1,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/k3l0-dev/aci-mcp"
Repository = "https://github.com/k3l0-dev/aci-mcp"
Documentation = "https://github.com/k3l0-dev/aci-mcp/tree/main/docs"
Changelog = "https://github.com/k3l0-dev/aci-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/k3l0-dev/aci-mcp/issues"
"Commercial License" = "mailto:monark.aiops@pm.me"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude tests/live/ (real APIC required) from the default run so a plain
# `uv run pytest` never attempts network access to the internal lab
# simulator. Run the live suite explicitly with:
#   uv run pytest tests/live/ -m live
# or override this default entirely with --override-ini addopts="".
addopts = ["-m", "not live"]
markers = [
    "live: requires a reachable real APIC (see tests/live/conftest.py)",
]

[tool.ruff.lint]
# Explicit rule selection so ruff upgrades never change lint behavior
# silently (0.16.0 grew the default set from 59 to 413 rules). New rule
# families are adopted here deliberately, not by upstream default.
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "UP",              # pyupgrade
    "RUF",             # ruff-specific rules
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0,<1.0",
]
