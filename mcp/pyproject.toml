[project]
name = "niwashi-mcp"
version = "2.0.0rc1"
description = "Schema-driven MCP server for Cisco ACI (APIC)"
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.12"
authors = [
    {name = "Khalid El-Ouiali", email = "monark.aiops@pm.me"},
]
maintainers = [
    {name = "Khalid El-Ouiali", email = "monark.aiops@pm.me"},
]
keywords = ["mcp", "cisco", "aci", "apic", "network-automation", "llm", "niwaki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.4.5,<4.0",
    "httpx>=0.27,<1.0",
    # Pinned to a single minor, not `<2.0`: this server reads the *private*
    # SQLite schema of niwaki's embedded catalogue (see registry/catalog.py —
    # the fields it needs have no public accessor yet). That schema is not
    # covered by niwaki's SemVer contract, so a 1.9 could restructure it
    # legitimately. `catalog.verify_catalogue()` refuses startup if it ever
    # does; this pin keeps the resolver from getting there in the first place.
    "niwaki>=1.8,<1.9",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niwashi_mcp"]

[project.scripts]
niwashi-mcp = "niwashi_mcp.main:main"

[project.urls]
Homepage = "https://github.com/k3l0-dev/niwashi-mcp"
Repository = "https://github.com/k3l0-dev/niwashi-mcp"
Documentation = "https://github.com/k3l0-dev/niwashi-mcp/tree/main/docs"
Changelog = "https://github.com/k3l0-dev/niwashi-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/k3l0-dev/niwashi-mcp/issues"
"Commercial License" = "mailto:monark.aiops@pm.me"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude tests/live/ (real APIC required) from the default run so a plain
# `uv run pytest` never attempts network access to the internal lab
# simulator. Run the live suite explicitly with:
#   uv run pytest tests/live/ -m live
# or override this default entirely with --override-ini addopts="".
addopts = ["-m", "not live"]
markers = [
    "live: requires a reachable real APIC (see tests/live/conftest.py)",
    "baseline: asserts behaviour equals tests/baseline/baseline.json (drift net)",
    "catalog: exercises the niwaki catalogue adapter (registry/catalog.py)",
]

[tool.ruff.lint]
# Explicit rule selection so ruff upgrades never change lint behavior
# silently (0.16.0 grew the default set from 59 to 413 rules). New rule
# families are adopted here deliberately, not by upstream default.
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "UP",              # pyupgrade
    "RUF",             # ruff-specific rules
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1,<1.0",
]
